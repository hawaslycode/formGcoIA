# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS POSTGRESQL
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_lealtad_gco}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACIÓN DE JPA E HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# ===================================================================
# INICIALIZACIÓN DE SCRIPTS SQL (CATÁLOGOS Y SEMILLAS)
# ===================================================================
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:scripts/datosIniciales.sql
spring.sql.init.continue-on-error=true

# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR DE CORREO (SMTP - GMAIL)
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:hawaslycode@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:dswb ttbh ozuh odrw}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================================================================
# CONFIGURACIÓN DE URL DEL FRONTEND
# ===================================================================
app.frontend.url=${APP_FRONTEND_URL:https://formulariogcolealtad.vercel.app}